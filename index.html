<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dbskill 审稿台 · DeepSeek V4 Pro</title>
<!-- 加到手机主屏后全屏打开，不显示浏览器地址栏 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="审稿台">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfbfc; --border:#e3e5e9;
  --text:#16181d; --text-2:#5b6270; --text-3:#8a91a0;
  --accent:#2f6df6; --accent-soft:#eaf0ff;
  --ok:#137a4a; --warn:#a86400; --bad:#c0342b;
  --code-bg:#f2f3f5;
  --shadow:0 1px 2px rgba(16,20,30,.05),0 8px 24px rgba(16,20,30,.06);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1115; --panel:#171a20; --panel-2:#1c2027; --border:#2a2f39;
    --text:#e8eaee; --text-2:#a2a9b7; --text-3:#727a89;
    --accent:#5b8cff; --accent-soft:#1b2436;
    --ok:#4ec98a; --warn:#e0a643; --bad:#f0736a;
    --code-bg:#22262e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.7; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}

/* ---------- 布局 ---------- */
.wrap{max-width:1560px;margin:0 auto;padding:20px}
header.top{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:0 4px 16px;
}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:17px;font-weight:650;margin:0;letter-spacing:.2px}
.brand .sub{font-size:12px;color:var(--text-3)}
.spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:999px;border:1px solid var(--border);
  background:var(--panel);font-size:12px;color:var(--text-2);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.dot.on{background:var(--ok)}
.dot.err{background:var(--bad)}

.grid{display:grid;grid-template-columns:minmax(360px,460px) 1fr;gap:20px;align-items:start}
@media (max-width:1000px){.grid{grid-template-columns:1fr}}

.card{
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  box-shadow:var(--shadow);
}
.card + .card{margin-top:16px}
.card-hd{
  padding:13px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:8px;
}
.card-hd h2{font-size:13px;font-weight:600;margin:0;letter-spacing:.3px}
.card-bd{padding:16px}

label.fld{display:block;margin-bottom:14px}
label.fld:last-child{margin-bottom:0}
label.fld > span.lb{
  display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:500;
}
input[type=text],input[type=password],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;
  background:var(--panel-2);outline:none;transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
textarea#draft{min-height:340px;resize:vertical;line-height:1.75;font-size:14px}
.hint{font-size:11.5px;color:var(--text-3);margin-top:6px;line-height:1.6}

.row{display:flex;gap:10px}
.row > *{flex:1}

/* ---------- 维度勾选 ---------- */
.modes{display:flex;flex-direction:column;gap:8px}
.mode{
  display:flex;gap:11px;align-items:flex-start;
  padding:10px 12px;border:1px solid var(--border);border-radius:9px;
  background:var(--panel-2);cursor:pointer;transition:border-color .15s,background .15s;
}
.mode:hover{border-color:var(--text-3)}
.mode.sel{border-color:var(--accent);background:var(--accent-soft)}
.mode input{margin:4px 0 0;accent-color:var(--accent);flex:none;width:15px;height:15px;cursor:pointer}
.mode .mt{font-weight:600;font-size:13px}
.mode .md{font-size:11.5px;color:var(--text-2);margin-top:2px}
.mode .src{font-size:11px;color:var(--text-3);font-family:ui-monospace,Menlo,Consolas,monospace}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 16px;border-radius:9px;border:1px solid var(--border);
  background:var(--panel-2);cursor:pointer;font-weight:550;font-size:13px;
  transition:background .15s,border-color .15s,opacity .15s;
  flex:none;white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:var(--text-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:7px;font-weight:500}
.btn.danger{color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}

/* ---------- 报告 ---------- */
#reports{display:flex;flex-direction:column;gap:16px}
.empty{
  border:1px dashed var(--border);border-radius:12px;padding:56px 24px;
  text-align:center;color:var(--text-3);font-size:13px;line-height:2;
}
.rep-hd{
  padding:12px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;
}
.rep-hd h3{margin:0;font-size:13.5px;font-weight:650;flex:1}
.badge{
  font-size:11px;padding:2px 8px;border-radius:999px;
  border:1px solid var(--border);color:var(--text-2);background:var(--panel-2);
  font-weight:500;white-space:nowrap;
}
.badge.run{color:var(--accent);border-color:var(--accent)}
.badge.done{color:var(--ok);border-color:var(--ok)}
.badge.fail{color:var(--bad);border-color:var(--bad)}
.chev{color:var(--text-3);transition:transform .2s;flex:none}
.rep.collapsed .chev{transform:rotate(-90deg)}
.rep.collapsed .rep-bd{display:none}
.rep-bd{padding:4px 20px 20px}

details.think{
  margin:12px 0;border:1px solid var(--border);border-radius:8px;background:var(--panel-2);
}
details.think summary{padding:8px 12px;cursor:pointer;font-size:12px;color:var(--text-2)}
details.think .tk{padding:0 12px 12px;font-size:12.5px;color:var(--text-2);white-space:pre-wrap}

.err-box{
  margin:12px 0;padding:12px 14px;border-radius:8px;
  border:1px solid var(--bad);color:var(--bad);background:var(--panel-2);
  font-size:12.5px;white-space:pre-wrap;word-break:break-word;
}

/* ---------- markdown ---------- */
.md-body{font-size:14px;line-height:1.8;word-wrap:break-word}
.md-body h1{font-size:19px;margin:22px 0 12px;font-weight:650;letter-spacing:.2px}
.md-body h2{font-size:16px;margin:22px 0 10px;font-weight:650;padding-bottom:6px;border-bottom:1px solid var(--border)}
.md-body h3{font-size:14.5px;margin:18px 0 8px;font-weight:650}
.md-body h4{font-size:13.5px;margin:16px 0 6px;font-weight:600;color:var(--text-2)}
.md-body p{margin:10px 0}
.md-body ul,.md-body ol{margin:10px 0;padding-left:22px}
.md-body li{margin:4px 0}
.md-body blockquote{
  margin:12px 0;padding:9px 14px;border-left:3px solid var(--accent);
  background:var(--panel-2);border-radius:0 7px 7px 0;color:var(--text-2);
}
.md-body blockquote p{margin:4px 0}
.md-body code{
  background:var(--code-bg);padding:1.5px 5px;border-radius:4px;font-size:12.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.md-body pre{
  background:var(--code-bg);padding:12px 14px;border-radius:8px;
  overflow-x:auto;margin:12px 0;
}
.md-body pre code{background:none;padding:0;font-size:12.5px;line-height:1.6}
.md-body hr{border:0;border-top:1px solid var(--border);margin:20px 0}
.md-body del{color:var(--bad);opacity:.72;text-decoration-thickness:1.5px}
.md-body strong{font-weight:650}
.md-body ins{
  text-decoration:none;background:rgba(19,122,74,.12);
  border-bottom:1.5px solid var(--ok);padding:0 2px;border-radius:2px;
}
@media (prefers-color-scheme:dark){.md-body ins{background:rgba(78,201,138,.15)}}
.tbl-wrap{overflow-x:auto;margin:12px 0}
.md-body table{border-collapse:collapse;width:100%;font-size:13px}
.md-body th,.md-body td{border:1px solid var(--border);padding:7px 11px;text-align:left;vertical-align:top}
.md-body th{background:var(--panel-2);font-weight:600}
.cursor{
  display:inline-block;width:7px;height:15px;background:var(--accent);
  vertical-align:-2px;animation:bl .9s steps(2,start) infinite;
}
@keyframes bl{to{visibility:hidden}}

/* ---------- 手机 ---------- */
@media (max-width:640px){
  .wrap{padding:12px}
  header.top{padding:0 2px 12px;gap:8px}
  .brand h1{font-size:16px}
  .brand .sub{display:none}
  /* iOS 上输入控件字号小于 16px，聚焦时会强行放大整个页面 */
  input[type=text],input[type=password],select,textarea{font-size:16px}
  textarea#draft{min-height:200px;font-size:16px}  /* id 选择器，必须在这里重申字号才压得过上面那条 */
  .card-bd{padding:14px}
  .row{flex-direction:column;gap:0}
  .btn{padding:11px 14px}          /* 触摸目标够大 */
  .btn.sm{padding:9px 12px;font-size:13px}
  .rep-bd{padding:4px 14px 16px}
  .actions{position:sticky;bottom:12px}
  .md-body table{font-size:12.5px}
  .md-body th,.md-body td{padding:6px 8px}
}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:9px 18px;border-radius:999px;
  font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:99;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="brand">
    <h1>dbskill 审稿台</h1>
    <span class="sub">DeepSeek V4 Pro · 6 个审稿维度</span>
  </div>
  <div class="spacer"></div>
  <span class="pill"><span class="dot" id="keyDot"></span><span id="keyTxt">未填 API Key</span></span>
  <span class="pill" id="modelPill">deepseek-v4-pro</span>
</header>

<div class="grid">

  <!-- ============ 左：输入 ============ -->
  <div>

    <div class="card">
      <div class="card-hd"><h2>连接设置</h2></div>
      <div class="card-bd">
        <label class="fld">
          <span class="lb">DeepSeek API Key</span>
          <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off" spellcheck="false">
          <div class="hint">只存在你这台设备的浏览器里（localStorage），不写进代码、不上传任何第三方。请求由你的浏览器直接发往 api.deepseek.com，不经过本站。</div>
          <div class="hint" id="storeState" style="margin-top:4px"></div>
        </label>
        <div class="row">
          <label class="fld">
            <span class="lb">模型</span>
            <input type="text" id="model" value="deepseek-v4-pro" spellcheck="false">
          </label>
          <label class="fld">
            <span class="lb">Base URL</span>
            <input type="text" id="baseUrl" value="https://api.deepseek.com/anthropic" spellcheck="false">
          </label>
        </div>
        <label class="fld" style="display:flex;align-items:center;gap:8px;margin-bottom:0">
          <input type="checkbox" id="thinking" style="width:auto;accent-color:var(--accent)">
          <span class="lb" style="margin:0">开启深度思考（更慢，诊断更细）</span>
        </label>
      </div>
    </div>

    <div class="card">
      <div class="card-hd"><h2>稿件</h2><div class="spacer"></div>
        <span class="badge" id="charCount">0 字</span>
      </div>
      <div class="card-bd">
        <label class="fld">
          <span class="lb">把稿子粘进来</span>
          <textarea id="draft" placeholder="粘贴你的逐字稿 / 公众号长文 / 推文…"></textarea>
        </label>
        <div class="row">
          <label class="fld">
            <span class="lb">体裁（影响判定阈值）</span>
            <select id="genre">
              <option value="短视频逐字稿">短视频逐字稿</option>
              <option value="公众号长文">公众号长文</option>
              <option value="推文 / 社交媒体短文">推文 / 社交媒体</option>
              <option value="小红书图文">小红书图文</option>
              <option value="长视频 / 播客口播稿">长视频 / 播客口播</option>
              <option value="学术或正式文体">学术 / 正式文体</option>
            </select>
          </label>
          <label class="fld">
            <span class="lb">拍摄方式（短视频用）</span>
            <select id="shootType">
              <option value="未说明">未说明</option>
              <option value="纯口播">纯口播</option>
              <option value="白板视频">白板视频</option>
              <option value="不适用（非视频）">不适用</option>
            </select>
          </label>
        </div>
        <label class="fld" style="margin-bottom:0">
          <span class="lb">补充背景（可选）</span>
          <input type="text" id="context" placeholder="目标受众、发布平台、这条想达成什么…">
        </label>
      </div>
    </div>

    <div class="card">
      <div class="card-hd"><h2>审稿维度</h2><div class="spacer"></div>
        <button class="btn sm" id="selAll">全选</button>
        <button class="btn sm" id="selNone">全不选</button>
      </div>
      <div class="card-bd">
        <div class="modes" id="modes"></div>
        <div class="actions">
          <button class="btn primary" id="run">开始审稿</button>
          <button class="btn danger" id="stop" style="display:none">停止</button>
        </div>
        <div class="hint" id="runHint" style="margin-top:10px">
          勾选的维度会各自独立调一次 DeepSeek，边生成边显示。
        </div>
      </div>
    </div>

  </div>

  <!-- ============ 右：报告 ============ -->
  <div>
    <div class="card" id="repToolbar" style="display:none">
      <div class="card-hd">
        <h2>审稿报告</h2>
        <div class="spacer"></div>
        <button class="btn sm" id="summarize">综合结论</button>
        <select id="rewriteScope" class="btn sm" style="width:auto;padding-right:6px;cursor:pointer" title="改稿范围">
          <option value="must">只改必改</option>
          <option value="all">全部都改</option>
        </select>
        <button class="btn sm primary" id="rewrite">改稿</button>
        <button class="btn sm" id="copyMd">复制 MD</button>
        <button class="btn sm" id="dlHtml">导出 HTML</button>
        <button class="btn sm" id="clearAll">清空</button>
      </div>
    </div>
    <div id="reports">
      <div class="empty" id="empty">
        左边粘上稿子，勾维度，点「开始审稿」。<br>
        审稿标准取自本机 dbskill 的 6 个 skill，不是通用文案点评。
      </div>
    </div>
  </div>

</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= dbskill 审稿维度 ================= */
/* 每条 system prompt 由本机 ~/.claude/skills/dbs-* 的 SKILL.md 抽取而成 */

var COMMON_TAIL = [
  '',
  '## 通用输出纪律',
  '',
  '1. 每一条结论都必须引用稿件原文。禁止「整体感觉…」「建议加强…」这类空话。',
  '2. 不讨好用户。有问题就说有，没问题就直说没问题，不要为了凑报告硬找。',
  '3. 给行动不给建议。写「第 3 段这句改成 X」，不写「可以考虑优化一下」。',
  '4. 你自己的措辞不许犯 AI 味：不用「你可能会觉得」开头，不用高密度「不是 X 是 Y」，不用「本质上」「归根结底」升维收尾，不写「你值得」式祝福结尾。',
  '5. 用中文回复，遵循《中文文案排版指北》（中英文之间加空格）。',
  '6. 直接输出报告正文，不要写开场白、不要复述任务、不要在结尾追问用户。'
].join('\n');

var MODES = [
  {
    id:'ai',
    name:'AI 味检测',
    src:'dbs-ai-check',
    desc:'扫 22 个 AI 写作指纹，逐处引用原文',
    on:true,
    system: [
      '你是 dontbesilent 的 AI 写作特征检测工具（dbs-ai-check）。任务是帮作者看清自己的文字里有哪些 AI 生成痕迹。',
      '',
      '## 立场',
      '你反对「去 AI 味」。识别 AI 特征是帮人看清自己的文字，不是帮人伪装成人类。如果你像任何一个人，你就不像 AI。',
      '本次只做识别，不改稿。',
      '',
      '## 三条原则',
      '1. AI 味的本质是「太完美」。问题不是写得差，是写得太光滑、太均匀，没有毛边、没有卡顿、没有一处是作者自己也没想通的。',
      '2. 去 AI 味 ≠ 好内容。关心有没有 AI 味的人很多，关心好不好的人很少。',
      '3. 不搞清作者意图之前，不改任何一个字。',
      '',
      '## 22 个特征',
      '1 堵住所有反驳｜2 知识全部输出（术语数据堆砌）｜3 匀速排比｜4 同一让步模板反复用｜5 给概念起名字的仪式｜6 情绪曲线太光滑｜7 替读者说一句蠢话然后纠正｜8「不是 X 是 Y」高密度｜9 没有任何犹豫｜10 精确到不真实的情绪细节（1.7 秒这类）｜11 脆弱感服务于论点｜12 把结论包装成「协议」｜13 每个段落都有收束金句｜14 句子节奏过于均匀｜15 用身体感受替代论证｜16 开头「钩子+痛点+承诺」三件套｜17 连接词过度使用且位置固定（然而/事实上/值得注意的是）｜18 同义词刻意替换｜19 中文翻译腔（作为/关于/基于/进行）｜20 虚假的「讲个故事」｜21 结尾「你值得」式祝福｜22 对「深刻」的过拟合（本质上/归根结底 + 升维）',
      '',
      '## 严重度',
      '🔴 强信号（几乎只有 AI 会这样做）｜⚠️ 中信号（AI 高频但人也可能做）｜💡 弱信号（要结合体裁判断）',
      '',
      '## 误伤警告（不许机械判定）',
      '- 特征 8「不是 X 是 Y」：800 字内出现 3 次以上才算。低密度是正常修辞，鲁迅、李敖、罗翔都用。',
      '- 特征 7 替读者说蠢话：这是经典修辞 prolepsis，只有当虚构的读者声音明显被矮化时才算。',
      '- 特征 13 段段金句：只适用于公众号长文。短视频逐字稿段段金句是体裁要求，不判定。',
      '- 特征 1 堵住反驳：只适用于自媒体/社交媒体。学术与法律论证穷尽反驳是规范，不判定。',
      '- 特征 5 命名仪式：同一篇出现 2 次以上同一句式才算，偶尔一次是正常修辞。',
      '- 特征 14 句子节奏：推文本身就短，推文体裁不判定。',
      '- 特征 2 知识全部输出：学术/正式文体不判定。',
      '',

/* ================= 极简 markdown 渲染 ================= */
function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g, function(m,a){return '<code>'+a+'</code>';});
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return s;
}
function renderMd(src){
  var lines = String(src).replace(/\r/g,'').split('\n');
  var out = [], i = 0;
  var FENCE = '```';
  function flushPara(buf){
    if(buf.length){ out.push('<p>'+inline(buf.join(' '))+'</p>'); buf.length = 0; }
  }
  var para = [];
  while(i < lines.length){
    var ln = lines[i];

    if(ln.trim().indexOf(FENCE) === 0){
      flushPara(para);
      var code = [], lang = ln.trim().slice(3).trim();
      i++;
      while(i < lines.length && lines[i].trim().indexOf(FENCE) !== 0){ code.push(lines[i]); i++; }
      i++;
      out.push('<pre><code data-lang="'+esc(lang)+'">'+esc(code.join('\n'))+'</code></pre>');
      continue;
    }

    if(/^\s{0,3}(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){
      flushPara(para); out.push('<hr>'); i++; continue;
    }

    var h = ln.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
    if(h){
      flushPara(para);
      var lv = Math.min(h[1].length,4);
      out.push('<h'+lv+'>'+inline(h[2].trim())+'</h'+lv+'>');
      i++; continue;
    }

    // 表格
    if(ln.indexOf('|') !== -1 && i+1 < lines.length && /^\s*\|?[\s:\-|]+\|[\s:\-|]*$/.test(lines[i+1]) && lines[i+1].indexOf('-') !== -1){
      flushPara(para);
      var cells = function(r){
        var t = r.trim().replace(/^\|/,'').replace(/\|$/,'');
        return t.split('|').map(function(c){return c.trim();});
      };
      var head = cells(ln); i += 2;
      var body = [];
      while(i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].trim() !== ''){ body.push(cells(lines[i])); i++; }
      var t = '<div class="tbl-wrap"><table><thead><tr>';
      head.forEach(function(c){ t += '<th>'+inline(c)+'</th>'; });
      t += '</tr></thead><tbody>';
      body.forEach(function(r){
        t += '<tr>';
        for(var k=0;k<head.length;k++){ t += '<td>'+inline(r[k]||'')+'</td>'; }
        t += '</tr>';
      });
      out.push(t + '</tbody></table></div>');
      continue;
    }

    if(/^\s{0,3}>\s?/.test(ln)){
      flushPara(para);
      var q = [];
      while(i < lines.length && /^\s{0,3}>\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s{0,3}>\s?/,'')); i++; }
      out.push('<blockquote>'+renderMd(q.join('\n'))+'</blockquote>');
      continue;
    }

    if(/^\s*([-*+]\s+|\d+[.)]\s+)/.test(ln)){
      flushPara(para);
      var ordered = /^\s*\d+[.)]\s+/.test(ln);
      var items = [];
      while(i < lines.length && /^\s*([-*+]\s+|\d+[.)]\s+)/.test(lines[i])){
        items.push(lines[i].replace(/^\s*([-*+]\s+|\d+[.)]\s+)/,''));
        i++;
        while(i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]\s+|\d+[.)]\s+)/.test(lines[i])){
          items[items.length-1] += ' ' + lines[i].trim(); i++;
        }
      }
      var tag = ordered ? 'ol' : 'ul';
      out.push('<'+tag+'>'+items.map(function(x){return '<li>'+inline(x)+'</li>';}).join('')+'</'+tag+'>');
      continue;
    }

    if(ln.trim() === ''){ flushPara(para); i++; continue; }

    para.push(ln.trim());
    i++;
  }
  flushPara(para);
  return out.join('\n');
}

/* 复制纯文本。Windows 下统一成 CRLF，粘进记事本 / Word / 剪映不会挤成一行。 */
function copyText(str, okMsg){
  var txt = String(str).replace(/\r\n/g,'\n').replace(/\n/g,'\r\n');
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    toast(ok ? (okMsg || '已复制') : '复制失败，请手动选中复制');
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast(okMsg || '已复制'); }, fallback);
  }else{ fallback(); }
}

function downloadTxt(str, filename){
  var txt = String(str).replace(/\r\n/g,'\n').replace(/\n/g,'\r\n');
  // 带 BOM，老一点的 Windows 工具才认得出这是 UTF-8 中文
  var blob = new Blob(['﻿' + txt], { type:'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  toast('已下载 ' + filename);
}

/* 向浏览器申请「持久存储」。拿到之后，key 不会因为系统清缓存或长期不用被自动抹掉。
   Chrome / Android 通常直接批准；Safari 的策略更严，批不批要看它自己。 */
var persistAsked = false;
function reportStore(granted){
  var el = $('storeState');
  if(!el) return;
  if(granted === true){
    el.textContent = '✓ 已申请到持久存储，key 会一直留着，除非你手动清浏览器数据。';
    el.style.color = 'var(--ok)';
  }else if(granted === false){
    el.textContent = '⚠ 浏览器没批准持久存储。iOS Safari 上如果连续 7 天没打开过本站，key 可能被自动清掉——把本站加到主屏、或者每周用一次就不会。';
    el.style.color = 'var(--warn)';
  }else{
    el.textContent = '';
  }
}
function ensurePersist(){
  if(persistAsked || !$('apiKey').value.trim()) return;
  if(!(navigator.storage && navigator.storage.persist)){ reportStore(false); return; }
  persistAsked = true;
  navigator.storage.persist().then(reportStore, function(){ reportStore(false); });
}
function checkPersist(){
  if(!$('apiKey').value.trim()){ reportStore(null); return; }
  if(navigator.storage && navigator.storage.persisted){
    navigator.storage.persisted().then(function(p){
      if(p) reportStore(true); else ensurePersist();
    }, function(){ ensurePersist(); });
  }else{ reportStore(false); }
}

/* ================= API ================= */
function callDeepSeek(system, user, onText, onThink, signal){
  var base = $('baseUrl').value.trim().replace(/\/+$/,'');
  var body = {
    model: $('model').value.trim(),
    max_tokens: 8000,
    system: system,
    messages: [{ role:'user', content:[{ type:'text', text:user }] }],
    stream: true
  };
  if($('thinking').checked){
    body.thinking = { type:'enabled', budget_tokens: 4000 };
    body.temperature = 1;
  }else{
    body.temperature = 0.6;
  }

  return fetch(base + '/v1/messages', {
    method:'POST',
    headers:{
      'content-type':'application/json',
      'x-api-key': $('apiKey').value.trim(),
      'anthropic-version':'2023-06-01'
    },
    body: JSON.stringify(body),
    signal: signal
  }).then(function(res){
    if(!res.ok){
      return res.text().then(function(t){
        var msg = 'HTTP ' + res.status;
        try{ var j = JSON.parse(t); if(j.error && j.error.message) msg += ' · ' + j.error.message; }
        catch(e){ if(t) msg += ' · ' + t.slice(0,300); }
        if(res.status === 401) msg += '\n\nAPI Key 不对，或者没有权限调这个模型。';
        if(res.status === 404) msg += '\n\n模型名或 Base URL 不对。注意：传了不支持的模型名，DeepSeek 会静默降级到 deepseek-v4-flash。';
        if(res.status === 402) msg += '\n\n账户余额不足。';
        if(res.status === 429) msg += '\n\n触发限速，等一会儿再试。';
        throw new Error(msg);
      });
    }
    var reader = res.body.getReader();
    var dec = new TextDecoder('utf-8');
    var buf = '';
    function pump(){
      return reader.read().then(function(r){
        if(r.done) return;
        buf += dec.decode(r.value, { stream:true });
        var parts = buf.split('\n');
        buf = parts.pop();
        parts.forEach(function(line){
          line = line.trim();
          if(line.indexOf('data:') !== 0) return;
          var payload = line.slice(5).trim();
          if(!payload || payload === '[DONE]') return;
          var ev;
          try{ ev = JSON.parse(payload); }catch(e){ return; }
          if(ev.type === 'content_block_delta' && ev.delta){
            if(ev.delta.type === 'text_delta' && ev.delta.text) onText(ev.delta.text);
            else if(ev.delta.type === 'thinking_delta' && ev.delta.thinking) onThink(ev.delta.thinking);
          }else if(ev.type === 'error'){
            throw new Error((ev.error && ev.error.message) || '服务端返回 error 事件');
          }
        });
        return pump();
      });
    }
    return pump();
  });
}

function buildUserMsg(){

/* ================= 主流程 ================= */
function run(){
  var key = $('apiKey').value.trim();
  if(!key){ toast('先填 API Key'); $('apiKey').focus(); return; }
  var draft = $('draft').value.trim();
  if(draft.length < 30){ toast('稿子太短了，至少 30 字'); $('draft').focus(); return; }
  var picked = MODES.filter(function(m){ return m.on; });
  if(!picked.length){ toast('至少勾一个维度'); return; }

  saveCfg();
  state.running = true; state.results = {};
  state.abort = new AbortController();
  $('run').disabled = true; $('stop').style.display = '';
  $('empty').style.display = 'none';
  $('repToolbar').style.display = '';
  $('reports').innerHTML = '';

  var cards = {};
  picked.forEach(function(m){
    var c = makeCard(m); cards[m.id] = c; $('reports').appendChild(c);
  });

  var user = buildUserMsg();
  var chain = Promise.resolve();

  picked.forEach(function(m){
    chain = chain.then(function(){
      if(state.abort.signal.aborted) return;
      var card = cards[m.id];
      var status = card.querySelector('.status');
      var body = card.querySelector('.body');
      status.textContent = '生成中'; status.className = 'badge run status';

      var acc = '', thinkAcc = '';
      var thinkEl = null;
      body.innerHTML = '<span class="cursor"></span>';

      function paint(){
        body.innerHTML = renderMd(acc) + '<span class="cursor"></span>';
      }
      var raf = null;
      function schedule(){
        if(raf) return;
        raf = requestAnimationFrame(function(){ raf = null; paint(); });
      }

      return callDeepSeek(m.system, user,
        function(t){ acc += t; schedule(); },
        function(t){
          thinkAcc += t;
          if(!thinkEl){
            thinkEl = document.createElement('details');
            thinkEl.className = 'think';
            thinkEl.innerHTML = '<summary>思考过程</summary><div class="tk"></div>';
            card.querySelector('.rep-bd').insertBefore(thinkEl, body);
          }
          thinkEl.querySelector('.tk').textContent = thinkAcc;
        },
        state.abort.signal
      ).then(function(){
        if(raf){ cancelAnimationFrame(raf); raf = null; }
        body.innerHTML = renderMd(acc);
        state.results[m.id] = { name:m.name, src:m.src, text:acc };
        status.textContent = '完成'; status.className = 'badge done status';
      }).catch(function(err){
        if(raf){ cancelAnimationFrame(raf); raf = null; }
        if(err && err.name === 'AbortError'){
          body.innerHTML = renderMd(acc);
          status.textContent = '已停止'; status.className = 'badge status';
          return;
        }
        body.innerHTML = renderMd(acc) +
          '<div class="err-box">' + esc(String(err && err.message || err)) + '</div>';
        status.textContent = '失败'; status.className = 'badge fail status';
      });
    });
  });

  chain.then(function(){
    state.running = false;
    $('stop').style.display = 'none';
    updateRunHint();
    if(!state.abort.signal.aborted) toast('审稿完成');
  });
}

function summarize(){
  var done = Object.keys(state.results);
  if(done.length < 2){ toast('至少要有 2 个维度跑完才有得合'); return; }
  var old = document.querySelector('.rep[data-mode="__sum"]');
  if(old) old.remove();

  var card = makeCard({ id:'__sum', name:'综合结论', src:'总编' });
  $('reports').insertBefore(card, $('reports').firstChild);
  var status = card.querySelector('.status');
  var body = card.querySelector('.body');
  status.textContent = '生成中'; status.className = 'badge run status';

  var msg = ['【稿件全文】', $('draft').value.trim(), '', '【各维度审稿报告】'];
  done.forEach(function(id){
    var r = state.results[id];
    msg.push('', '#### 维度：' + r.name + '（' + r.src + '）', r.text);
  });
  msg.push('', '把上面这些合成一份决断。');

  var acc = '';
  state.abort = new AbortController();
  body.innerHTML = '<span class="cursor"></span>';
  callDeepSeek(SUMMARY_SYSTEM, msg.join('\n'),
    function(t){ acc += t; body.innerHTML = renderMd(acc) + '<span class="cursor"></span>'; },
    function(){},
    state.abort.signal
  ).then(function(){
    body.innerHTML = renderMd(acc);
    state.results['__sum'] = { name:'综合结论', src:'总编', text:acc };
    status.textContent = '完成'; status.className = 'badge done status';
  }).catch(function(err){
    body.innerHTML = renderMd(acc) + '<div class="err-box">' + esc(String(err && err.message || err)) + '</div>';
    status.textContent = '失败'; status.className = 'badge fail status';
  });
}

/* ---------- 标记式改稿 ---------- */
function rewrite(){
  var done = Object.keys(state.results).filter(function(id){ return id !== '__rw'; });
  if(!done.length){ toast('先跑一次审稿，改稿要基于审稿报告'); return; }
  if(!$('apiKey').value.trim()){ toast('先填 API Key'); return; }

  var old = document.querySelector('.rep[data-mode="__rw"]');
  if(old) old.remove();

  var scope = $('rewriteScope').value;
  var card = makeCard({ id:'__rw', name:'标记式改稿', src:'dbs-script-flow' });
  $('reports').insertBefore(card, $('reports').firstChild);

  var hd = card.querySelector('.rep-hd');
  // 一键去标记复制成纯文本，不用先生成干净版
  var txtBtn = hdBtn(hd, '复制 TXT', function(){
    var r = state.results['__rw'];
    if(!r || !r.text){ toast('还没有改稿结果'); return; }
    var clean = stripMarks(r.text);
    if(!clean){ toast('没能从改稿结果里提取出正文'); return; }
    copyText(clean, '定稿已复制为纯文本（' + clean.length + ' 字）');
  });
  txtBtn.disabled = true;
  var dlBtn = hdBtn(hd, '下载 .txt', function(){
    var r = state.results['__rw'];
    if(!r || !r.text) return;
    var clean = stripMarks(r.text);
    if(!clean){ toast('没能提取出正文'); return; }
    downloadTxt(clean, '定稿-' + new Date().toISOString().slice(0,10) + '.txt');
  });
  dlBtn.disabled = true;
  var cleanBtn = hdBtn(hd, '生成干净版', showClean);
  cleanBtn.disabled = true;

  var status = card.querySelector('.status');
  var body = card.querySelector('.body');
  status.textContent = '改稿中'; status.className = 'badge run status';

  var msg = ['【原稿】', $('draft').value.trim(), '', '【审稿报告】'];
  done.forEach(function(id){
    var r = state.results[id];
    msg.push('', '#### ' + r.name + '（' + r.src + '）', r.text);
  });
  msg.push('', scope === 'must'
    ? '改稿范围：只改报告里判定为必须改 / 高风险（🔴）的部分。中低风险和「改了更好」的建议一律不动，保留作者原文。'
    : '改稿范围：报告里提到的所有问题都改，包括小建议（🟢）。');
  msg.push('按你的输出结构改这篇稿。');

  var acc = '';
  state.abort = new AbortController();
  body.innerHTML = '<span class="cursor"></span>';
  var raf = null;
  function schedule(){
    if(raf) return;
    raf = requestAnimationFrame(function(){ raf = null; body.innerHTML = renderMd(acc) + '<span class="cursor"></span>'; });
  }

  callDeepSeek(REWRITE_SYSTEM, msg.join('\n'),
    function(t){ acc += t; schedule(); },
    function(){},
    state.abort.signal
  ).then(function(){
    if(raf){ cancelAnimationFrame(raf); raf = null; }
    body.innerHTML = renderMd(acc);
    state.results['__rw'] = { name:'标记式改稿', src:'dbs-script-flow', text:acc };
    status.textContent = '完成'; status.className = 'badge done status';
    txtBtn.disabled = false; dlBtn.disabled = false; cleanBtn.disabled = false;
  }).catch(function(err){
    if(raf){ cancelAnimationFrame(raf); raf = null; }
    if(err && err.name === 'AbortError'){
      body.innerHTML = renderMd(acc);
      status.textContent = '已停止'; status.className = 'badge status';
      if(acc){ txtBtn.disabled = false; dlBtn.disabled = false; cleanBtn.disabled = false; }
      state.results['__rw'] = { name:'标记式改稿', src:'dbs-script-flow', text:acc };
      return;
    }
    body.innerHTML = renderMd(acc) + '<div class="err-box">' + esc(String(err && err.message || err)) + '</div>';
    status.textContent = '失败'; status.className = 'badge fail status';
  });
}

/* 把标记吃掉，得到可直接使用的定稿。纯本地处理，不再调模型。 */
function stripMarks(md){
  var text = md;
  // 砍掉改动清单和决断，只留正文
  var cut = text.search(/^\s{0,3}#{1,4}\s*(改动清单|决断)\s*$/m);
  if(cut > -1) text = text.slice(0, cut);
  var lines = text.replace(/\r/g,'').split('\n');
  var out = [];
  lines.forEach(function(ln){
    // 整行都是被删掉的原文 → 丢弃
    if(/^\s{0,3}~~[\s\S]*~~\s*$/.test(ln.trim())) return;
    // ⚠️ 是给作者看的元信息，不进定稿
    if(/^\s*⚠️/.test(ln)) return;
    // 兜底：整行只是一句括号里的删除说明（🆕（此处已删））——是元信息不是正文
    if(/^\s*🆕\s*[（(][^）)]*(删|略去|省略|此处|原文|保留原)[^）)]*[）)]\s*$/.test(ln)) return;
    var s = ln;
    s = s.replace(/~~[^~]*~~/g, '');       // 行内删除线内容去掉
    s = s.replace(/^(\s*)🆕\s*/, '$1');    // 行首 🆕 标记去掉
    s = s.replace(/🆕\s*/g, '');           // 行内残留的 🆕
    s = s.replace(/[ \t]+$/,'');
    if(s.trim() === '' && ln.trim() !== '') return; // 整行被标记吃空了
    out.push(s);
  });
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}

function showClean(){
  var rw = state.results['__rw'];
  if(!rw || !rw.text){ toast('还没有改稿结果'); return; }
  var clean = stripMarks(rw.text);
  if(!clean){ toast('没能从改稿结果里提取出正文'); return; }

  var old = document.querySelector('.rep[data-mode="__clean"]');
  if(old) old.remove();

  var card = makeCard({ id:'__clean', name:'干净版定稿', src:'本地生成 · 未调模型' });
  $('reports').insertBefore(card, $('reports').firstChild);
  card.querySelector('.status').remove();

  var hd = card.querySelector('.rep-hd');
  var cnt = document.createElement('span');
  cnt.className = 'badge';
  cnt.textContent = clean.length + ' 字（原稿 ' + $('draft').value.trim().length + ' 字）';
  hd.appendChild(cnt);
  hdBtn(hd, '复制 TXT', function(){ copyText(clean, '定稿已复制（' + clean.length + ' 字）'); });
  hdBtn(hd, '下载 .txt', function(){
    downloadTxt(clean, '定稿-' + new Date().toISOString().slice(0,10) + '.txt');
  });

  card.querySelector('.body').innerHTML =
    '<pre style="white-space:pre-wrap;background:var(--panel-2);padding:14px;border-radius:8px;' +
    'font-family:inherit;font-size:14px;line-height:1.85;margin:0">' + esc(clean) + '</pre>';
  state.results['__clean'] = { name:'干净版定稿', src:'本地生成', text:clean };
  toast('已生成干净版');
}

function collectMd(){
  var out = ['# dbskill 审稿报告', '',
    '- 体裁：' + $('genre').value,
    '- 模型：' + $('model').value.trim(),
    '- 时间：' + new Date().toLocaleString('zh-CN'),
    '', '---', ''];
  var order = ['__clean','__rw','__sum'].concat(MODES.map(function(m){return m.id;}));
  order.forEach(function(id){
    var r = state.results[id];
    if(!r) return;
    out.push('## ' + r.name + '（' + r.src + '）', '', r.text, '', '---', '');
  });
  out.push('## 原稿', '', $('draft').value.trim());
  return out.join('\n');
}

/* ================= 绑定 ================= */
loadCfg();
renderModes();
refreshKeyPill();

$('apiKey').addEventListener('input', function(){ refreshKeyPill(); saveCfg(); checkPersist(); });
checkPersist();
$('model').addEventListener('input', function(){ refreshKeyPill(); saveCfg(); });
$('baseUrl').addEventListener('input', saveCfg);
$('thinking').addEventListener('change', saveCfg);
$('genre').addEventListener('change', saveCfg);
$('shootType').addEventListener('change', saveCfg);

$('draft').addEventListener('input', function(){
  $('charCount').textContent = $('draft').value.trim().length + ' 字';
});

$('selAll').addEventListener('click', function(){ MODES.forEach(function(m){m.on=true;}); renderModes(); saveCfg(); });
$('selNone').addEventListener('click', function(){ MODES.forEach(function(m){m.on=false;}); renderModes(); saveCfg(); });

$('run').addEventListener('click', run);
$('stop').addEventListener('click', function(){
  if(state.abort) state.abort.abort();
  state.running = false; $('stop').style.display = 'none'; updateRunHint();
});
$('summarize').addEventListener('click', summarize);
$('rewrite').addEventListener('click', rewrite);

$('copyMd').addEventListener('click', function(){
  copyText(collectMd(), '已复制 Markdown');
});

$('dlHtml').addEventListener('click', function(){
  var css = document.querySelector('style').textContent;
  var inner = '';
  var order = ['__clean','__rw','__sum'].concat(MODES.map(function(m){return m.id;}));
  order.forEach(function(id){
    var r = state.results[id];
    if(!r) return;
    inner += '<div class="card"><div class="card-hd"><h2>' + esc(r.name) +
             '</h2><div class="spacer"></div><span class="badge">' + esc(r.src) +
             '</span></div><div class="rep-bd"><div class="md-body">' + renderMd(r.text) + '</div></div></div>';
  });
  if(!inner){ toast('还没有可导出的报告'); return; }
  var html = '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">' +
    '<title>dbskill 审稿报告 ' + new Date().toLocaleDateString('zh-CN') + '</title>' +
    '<style>' + css + '</style></head><body><div class="wrap" style="max-width:900px">' +
    '<header class="top"><div class="brand"><h1>dbskill 审稿报告</h1>' +
    '<span class="sub">' + esc($('genre').value) + ' · ' + esc($('model').value.trim()) +
    ' · ' + new Date().toLocaleString('zh-CN') + '</span></div></header>' +
    inner +
    '<div class="card"><div class="card-hd"><h2>原稿</h2></div><div class="rep-bd">' +
    '<div class="md-body"><pre style="white-space:pre-wrap">' + esc($('draft').value) + '</pre></div></div></div>' +
    '</div></body></html>';
  var blob = new Blob([html], { type:'text/html;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'dbskill-审稿报告-' + new Date().toISOString().slice(0,10) + '.html';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
  toast('已导出');
});

$('clearAll').addEventListener('click', function(){
  state.results = {};
  $('reports').innerHTML = '';
  $('reports').appendChild($('empty'));
  $('empty').style.display = '';
  $('repToolbar').style.display = 'none';
});

document.addEventListener('keydown', function(e){
  if((e.metaKey || e.ctrlKey) && e.key === 'Enter'){ e.preventDefault(); if(!state.running) run(); }
});
